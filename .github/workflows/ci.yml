name: CI and container publication
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      promote_existing_commit:
        description: 'Optional: promote an already successful CI image commit to latest without rebuilding'
        type: string
        default: ''
concurrency:
  group: liyu-server-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    if: ${{ !inputs.promote_existing_commit }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: liyu_ci
          POSTGRES_USER: liyu
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U liyu -d liyu_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://liyu:ci-only-password@127.0.0.1:5432/liyu_ci
      LIYU_BIND: 127.0.0.1:18788
      LIYU_TEST_DELIVERY: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev postgresql-client
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/check-release-version.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo build --locked
      - name: Migrate and test isolated disposable databases
        run: python3 tests/run_ci.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: liyu-server-tests-${{ github.sha }}
          path: build/verification/api-tests.json
          if-no-files-found: error
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          build-args: |
            LIYU_GIT_HASH=${{ github.sha }}
            LIYU_GIT_DIRTY=false
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare versioned deployment package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          LIYU_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "liyu-server-tests-$GITHUB_SHA" --dir build/release
          python3 scripts/prepare-release.py
      - name: Publish server release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "礼遇服务端 $GITHUB_REF_NAME" --notes-file build/release-notes.md
  promote-latest:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote_existing_commit != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote an existing verified image, preserving all architectures
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.promote_existing_commit }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a full commit SHA'; exit 1; }
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SOURCE_COMMIT" --status success --json databaseId --jq '.[0].databaseId')
          test -n "$run_id" && test "$run_id" != null
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json jobs --jq '.jobs | any(.name == "image" and .conclusion == "success")' | grep -qx true
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          image="$repository:sha-$SOURCE_COMMIT"
          docker pull "$image"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_COMMIT"
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          docker buildx imagetools create --tag "$repository:latest" "$repository@$digest"
          docker buildx imagetools inspect "$repository:latest"
