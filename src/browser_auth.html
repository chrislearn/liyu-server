<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>礼遇账号授权</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6f3fc;color:#261c34;font:16px system-ui}main{max-width:480px;padding:24px;margin:auto}h1{font-size:23px}label{display:block;margin:16px 0 6px}input,button{font:inherit;width:100%;padding:12px;border:1px solid #ded5ec;border-radius:10px}button{margin-top:12px;background:#7560ca;color:white;cursor:pointer}button.secondary{background:transparent;color:#7560ca}small{display:block;color:#7c718a;line-height:1.6;margin:14px 0}#message{white-space:pre-wrap;color:#8c432e;min-height:24px}section[hidden]{display:none}</style>
<main><h1 id="title">礼遇账号授权</h1><small>此页面由礼遇服务器提供。密码与验证码只提交到此服务器，应用不会读取这些输入。</small><p id="message" role="status">正在检查授权请求…</p>
<section id="credentials" hidden><form id="loginForm"><label for="identity">邮箱 / 手机号</label><input id="identity" autocomplete="username" required maxlength="254"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required maxlength="128"><div id="registration" hidden><label for="name">显示名</label><input id="name" maxlength="50"><button type="button" id="registerCode">发送验证码</button><label for="code">验证码</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div><button id="loginButton">登录</button></form><button id="toggle" class="secondary">注册新账号</button></section>
<section id="confirmation" hidden><p id="account"></p><small>确认后允许 LIYU-MINI 使用此账号读取和管理礼遇数据。可在应用中退出登录，撤销该会话。</small><button id="confirm">确认授权</button></section>
<section id="contact" hidden><form id="contactForm"><label id="contactLabel" for="value">新邮箱</label><input id="value" required maxlength="254"><button type="button" id="contactCode">发送验证码</button><label for="verifyCode">验证码</label><input id="verifyCode" inputmode="numeric" autocomplete="one-time-code" required maxlength="6"><button>验证并保存</button></form></section>
<section id="complete" hidden><h2>已完成</h2><p>请返回应用，授权结果会自动同步。</p></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id), id=location.pathname.split('/').pop(), key=location.hash.slice(1), base='/api/v1/browser-authorizations/'+encodeURIComponent(id);
history.replaceState(null,'',location.pathname);
let flow, token='', mode='login', challenge='', contactChallenge='', busy=false;
const errors={'invalid password':'密码不正确','account not found':'账号不存在','contact already in use':'该联系方式已被使用','authorization expired or cancelled':'授权已过期或已取消，请返回应用重新开始','verification required or invalid code':'验证码无效或已过期','delivery provider is not configured':'服务器尚未配置邮件或短信发送服务','please wait before requesting another code':'请稍后再获取验证码','password must contain at least 8 bytes':'密码至少需要 8 个字符','authorization unavailable or wrong account':'授权不可用，或登录的账号不一致'};
async function api(path,body,method='POST',authenticated=false){const r=await fetch(path,{method,cache:'no-store',credentials:'omit',headers:{'Content-Type':'application/json',...(authenticated?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)});const data=r.status===204?{}:await r.json();if(!r.ok)throw Error(errors[data.error]||'操作失败（'+r.status+'）：'+(data.error||'请重试'));return data}
function show(name){for(const n of ['credentials','confirmation','contact','complete'])$(n).hidden=n!==name}
async function action(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('message').textContent='';try{await fn()}catch(e){$('message').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
$('toggle').onclick=()=>{mode=mode==='login'?'register':'login';$('registration').hidden=mode!=='register';$('loginButton').textContent=mode==='login'?'登录':'注册';$('toggle').textContent=mode==='login'?'注册新账号':'已有账号，去登录';$('password').autocomplete=mode==='login'?'current-password':'new-password';challenge=''};
$('registerCode').onclick=()=>action(async()=>{const value=$('identity').value.trim();const r=await api('/api/v1/auth/challenges',{kind:value.includes('@')?'email':'phone',value,purpose:'register'});challenge=r.challenge_id;$('message').textContent=r.test_code?'测试验证码：'+r.test_code:'验证码已发送'});
$('loginForm').onsubmit=e=>{e.preventDefault();action(async()=>{const r=await api(base+'/login?mode='+mode,{browser_key:key,identifier:$('identity').value.trim(),password:$('password').value,display_name:$('name').value.trim()||undefined,code:$('code').value,challenge_id:challenge});token=r.token;$('password').value='';$('code').value='';if(flow.owner_id!==null&&r.user.id!==flow.owner_id){await api('/api/v1/auth/logout',{},'POST',true);token='';throw Error('请使用应用当前登录的账号完成验证。')}$('account').textContent='将以 '+r.user.display_name+' 登录 LIYU-MINI';if(flow.purpose==='login'){show('confirmation')}else{$('title').textContent=flow.purpose==='email'?'修改邮箱':'修改手机号';$('contactLabel').textContent=flow.purpose==='email'?'新邮箱':'新手机号';$('value').type=flow.purpose==='email'?'email':'tel';show('contact')}})};
async function finish(){await api(base+'/approve',{browser_key:key},'POST',true);token='';show('complete')}
$('confirm').onclick=()=>action(finish);
$('contactCode').onclick=()=>action(async()=>{const r=await api('/api/v1/auth/challenges',{kind:flow.purpose,value:$('value').value.trim(),purpose:'bind'},'POST',true);contactChallenge=r.challenge_id;$('message').textContent=r.test_code?'测试验证码：'+r.test_code:'验证码已发送'});
$('value').oninput=()=>contactChallenge='';$('identity').oninput=()=>challenge='';
$('contactForm').onsubmit=e=>{e.preventDefault();action(async()=>{await api('/api/v1/me/'+flow.purpose,{value:$('value').value.trim(),code:$('verifyCode').value,challenge_id:contactChallenge},'PUT',true);$('verifyCode').value='';await finish()})};
action(async()=>{flow=await api(base+'/info',{browser_key:key});$('title').textContent=flow.purpose==='login'?'登录礼遇':'验证当前账号';if(flow.purpose!=='login')$('toggle').hidden=true;show('credentials')});
</script></html>
