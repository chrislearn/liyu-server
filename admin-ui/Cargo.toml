[package]
name = "liyu-admin"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["web", "launch", "macro", "html", "signals", "hooks", "document"] }
gloo-net = "0.7.0"
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "DomRect", "HtmlElement", "EventTarget"] }
wasm-bindgen = "0.2"
[features]
default = ["web"]
web = ["dioxus/web"]
