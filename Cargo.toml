[package]
name = "liyu-server"
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"

[dependencies]
argon2 = "0.5.3"
dotenvy = "0.15"
diesel = { version = "2.3", features = ["postgres", "r2d2", "serde_json", "uuid"] }
diesel_migrations = "2.3"
salvo = { version = "0.84", features = ["http1", "server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
# Real image decoding for avatar validation; only the formats we accept.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
