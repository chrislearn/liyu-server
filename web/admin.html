<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>礼遇 · 商品管理</title><link rel="stylesheet" href="/admin/app.css"><script src="/admin/app.js" defer></script></head>
<body><header><div><span class="mark">礼</span><strong>礼遇</strong><span class="muted">商品管理</span></div><div id="identity" hidden><span id="username"></span><button id="logout" class="quiet">退出登录</button></div></header>
<main><p id="notice" role="status" aria-live="polite"></p>
<section id="login-panel" class="login"><p class="eyebrow">LIYU ADMIN</p><h1>管理每一份心意</h1><p class="muted">使用管理员账号登录商品管理后台。</p><form id="login-form"><label>管理员账号<input name="username" autocomplete="username"></label><label>密码<input name="password" type="password" autocomplete="current-password"></label><button type="submit">登录后台</button></form></section>
<section id="workspace" hidden><div class="toolbar"><div><p class="eyebrow">CATALOG</p><h1>商品库</h1><p class="muted">编辑商品信息、库存、价格和展示图片。</p></div><button id="new-product">＋ 新增商品</button></div><form id="search-form" class="search"><input id="query" placeholder="搜索商品名称" aria-label="搜索商品名称" maxlength="100"><button class="quiet">搜索</button></form><div class="table-wrap"><table><thead><tr><th>商品</th><th>分类</th><th>价格</th><th>库存</th><th>状态</th><th>操作</th></tr></thead><tbody id="product-rows"></tbody></table></div><button id="more" class="quiet" hidden>加载更多</button>
</section>
<dialog id="editor"><form id="product-form"><div class="toolbar"><h2 id="editor-title">新增商品</h2><button id="close-editor" type="button" class="quiet">关闭</button></div><div class="fields"><label class="full">商品名称<input name="name" maxlength="200" required></label><label>分类<select name="category"><option value="coffee">咖啡茶饮</option><option value="movie">电影演出</option><option value="trendy">潮流小物</option><option value="blind">盲盒</option><option value="sweet">甜点鲜花</option><option value="digital">数码家电</option><option value="home">家居生活</option><option value="baby">母婴亲子</option></select></label><label>价格（元）<input name="price" type="number" min="0" max="10000000" step="0.01" required></label><label>库存<input name="stock" type="number" min="0" max="2147483647" step="1" required></label><label>品牌<input name="brand" maxlength="100"></label><label>类型<input name="kind" maxlength="100"></label><label>规格<input name="spec" maxlength="500"></label><label class="full">描述<textarea name="description" maxlength="5000" rows="3"></textarea></label><label class="full">标签（逗号分隔）<input name="tags" maxlength="1020"></label><label class="check"><input name="physical" type="checkbox">实物商品</label><label class="check"><input name="is_active" type="checkbox">上架展示</label></div><p id="editor-error" role="alert"></p><button id="save" type="submit">保存商品</button></form>
<div id="image-panel" hidden><hr><h3>商品图片</h3><p class="muted">JPEG / PNG / WebP，最大 4 MiB，16–4096 像素。上传后立即生效。</p><form id="image-form" class="images"><label>展示位置<select id="variant"><option value="card">卡片 / 默认图片</option><option value="thumb">缩略图</option><option value="detail">详情图</option></select></label><label>选择图片<input id="image-file" type="file" accept="image/jpeg,image/png,image/webp" required></label><button>上传图片</button></form><img id="preview" alt="商品图片预览" width="180" height="180"></div></dialog>
</main><footer>礼遇 · 管理后台</footer></body></html>
